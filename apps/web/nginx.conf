server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied behind the same origin — no CORS needed.
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /healthz {
        proxy_pass http://api:8080;
    }

    # Webhook deliveries: unauthenticated, secret in the path.
    location /hooks/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets are content-hashed; cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}